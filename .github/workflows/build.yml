name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Upstream Deekseep tag to build against
        required: false
        default: v1.7.5

permissions:
  contents: read

jobs:
  # Fast, hermetic check of the gateway itself. No Android SDK required.
  unit-tests:
    name: gateway tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch org.json
        run: |
          mkdir -p build/deps
          curl -fsSL --retry 3 \
            https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar \
            -o build/deps/json.jar

      - name: Run gateway test suite
        env:
          JSON_JAR: ${{ github.workspace }}/build/deps/json.jar
        run: bash run-tests.sh

  # Full module build against the upstream GPL source tree.
  build-module:
    name: build module APK
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Build module with Local API
        env:
          UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag || 'v1.7.5' }}
        run: bash ci/build-module.sh

      - name: Verify APK
        run: |
          APK=$(ls build/artifacts/*.apk | head -n1)
          echo "verifying $APK"
          "$ANDROID_SDK_ROOT"/build-tools/35.0.0/apksigner verify --verbose "$APK"
          "$ANDROID_SDK_ROOT"/build-tools/35.0.0/aapt2 dump badging "$APK" | head -n 5
          unzip -o -q "$APK" classes.dex -d build/verify

          # 1. The gateway must be present in the packaged DEX.
          grep -a -q 'Lcom/dsmod/probe/z1;' build/verify/classes.dex \
            || { echo "FAIL: gateway class missing from DEX"; exit 1; }
          echo "gateway classes found:"
          grep -a -o 'Lcom/dsmod/probe/z1[A-Za-z$]*;' build/verify/classes.dex | sort -u

          # 2. No upstream promotional content may ship in the product.
          status=0
          for needle in \
            'afdian' \
            't.me/Deekseepapp' \
            '1106465300' \
            'qun.qq.com' \
            'releases/latest' \
            'license.lllucccian' \
            'author=lllucccian' \
            'Sponsor via Afdian' \
            'Community group' \
          ; do
            if grep -a -q -- "$needle" build/verify/classes.dex; then
              echo "FAIL: promotional content present: $needle"
              status=1
            else
              echo "ok: absent -> $needle"
            fi
          done
          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deekseep-localapi-apk
          path: |
            build/artifacts/*.apk
            build/artifacts/*.sha256
          if-no-files-found: error
